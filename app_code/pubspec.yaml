name: alter_field_app
description: Field app for resolving hazardous-material incidents
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_maps_flutter: ^2.7.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  crypto: ^3.0.3
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0
  fl_chart: ^0.68.0
  path: ^1.9.0
  http_parser: ^4.0.2
  flutter_local_notifications: ^19.4.1
  permission_handler: ^12.0.1


dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true
